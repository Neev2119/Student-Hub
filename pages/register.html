<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - StudentHub</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/register.css">
</head>
<body class="auth-body">
    <div class="auth-card">
        <h1 class="register-title">StudentHub</h1>
        <p>Create your student account</p>
        <form id="registerForm" action="../php/process-form.php" method="post" novalidate>
            <input type="hidden" name="formType" value="registration">

            <label for="username">Username</label>
            <input id="username" name="username" type="text" placeholder="Choose a username" required pattern="[A-Za-z0-9_]{3,30}" title="Use 3 to 30 letters, numbers, or underscores">

            <label for="fullName">Full name</label>
            <input id="fullName" name="fullName" type="text" placeholder="Enter your full name" required pattern="[A-Za-z]+(?:(?: |'|-)[A-Za-z]+)+" title="Enter at least two names using letters, spaces, apostrophes, or hyphens">

            <label for="email">Email address</label>
            <input id="email" name="email" type="email" placeholder="Enter your email" required pattern="[^\s@]+@[^\s@]+\.[^\s@]{2,}" title="Enter a valid email address">

            <label for="phone">Phone number</label>
            <input id="phone" name="phone" type="tel" inputmode="numeric" placeholder="Enter your 10-digit mobile number" required pattern="[0-9]{10}" title="Enter a 10-digit mobile number">

            <div class="gender-group">
                <p>Gender</p>
                <label><input type="radio" name="gender" value="female" required> Female</label>
                <label><input type="radio" name="gender" value="male"> Male</label>
            </div>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Create a password" required pattern="(?=.*[A-Za-z])(?=.*[0-9])(?=.*[@$!%*?&]).{8,}" title="Use at least 8 characters, including a letter, a number, and a special character">

            <label for="confirmPassword">Confirm password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Re-enter password" required>

            <label class="terms-label">
                <input id="terms" name="terms" type="checkbox" required>
                I accept the terms and conditions.
            </label>

            <button type="submit">Create Account</button>
            <p id="registerMessage" class="form-message" role="status" aria-live="polite"></p>
        </form>
        <div class="auth-links">
            <a href="index.php">Home</a>
            <a href="login.html">Login</a>
        </div>
    </div>
    <script src="../javascript/register.js" defer></script>
</body>
</html>
